<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Music Studio</title>
<link rel="icon" href="/favicon.ico">
<style>
  :root {
    --bg: #14110f; --panel: #1d1916; --panel2: #25201c; --line: #3a322b; --text: #f3ebe1; --muted: #a8998a;
    --accent: #f0c88a; --accent2: #e3a95c; --ok: #8fcf9a; --warn: #f2b56b; --err: #ef8a7a; --r: 12px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.45 "Segoe UI", system-ui, sans-serif; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; border: 1px solid var(--line); background: var(--panel2); border-radius: 9px; padding: 8px 14px; }
  button:hover:not(:disabled) { border-color: var(--accent2); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--accent); color: #2a1d0e; border-color: var(--accent); font-weight: 600; }
  button.primary:hover:not(:disabled) { background: #f5d6a4; }
  button.ghost { background: transparent; }
  button.small { padding: 4px 10px; font-size: 12.5px; }
  input[type=text], input[type=url], input[type=number], select, textarea {
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; width: 100%;
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent2); }
  textarea { resize: vertical; min-height: 90px; font-size: 13px; }
  label { color: var(--muted); font-size: 12.5px; }
  .app { display: grid; grid-template-columns: 250px 1fr; height: 100vh; }
  aside { border-right: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  .brand { padding: 18px 18px 10px; font-weight: 700; font-size: 17px; letter-spacing: .3px; }
  .brand span { color: var(--accent); }
  .new { margin: 4px 14px 12px; }
  .plist { overflow: auto; padding: 0 8px 12px; flex: 1; }
  .pitem { padding: 9px 10px; border-radius: 9px; cursor: pointer; margin-bottom: 2px; border: 1px solid transparent; }
  .pitem:hover { background: var(--panel2); }
  .pitem.sel { background: var(--panel2); border-color: var(--line); }
  .pitem .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pitem .m { color: var(--muted); font-size: 12px; }
  .badge { font-size: 11px; padding: 1px 7px; border-radius: 99px; background: #2f3a2f; color: var(--ok); margin-left: 4px; }
  main { overflow: auto; min-width: 0; }
  .empty { display: grid; place-items: center; height: 100%; color: var(--muted); text-align: center; }
  .top { display: flex; gap: 10px; align-items: end; padding: 16px 20px 12px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); z-index: 5; }
  .top .grow { flex: 1; }
  .saved { color: var(--muted); font-size: 12px; min-width: 70px; text-align: right; padding-bottom: 8px; }
  .body { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 18px; padding: 18px 20px 40px; align-items: start; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; }
  .stage { position: relative; aspect-ratio: 16/9; border-radius: var(--r); overflow: hidden; background: #000; border: 1px solid var(--line); }
  .stage:fullscreen { width: 100vw; height: 100vh; aspect-ratio: auto; border: 0; border-radius: 0; }
  .stage:fullscreen video, .stage:fullscreen img, .stage:fullscreen canvas { object-fit: contain; }
  .stage .expand { position: absolute; z-index: 4; top: 12px; right: 12px; padding: 6px 9px; background: #111b; color: #fff; }
  .stage video, .stage img, .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .stage .nobg { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); }
  .hint { color: var(--muted); font-size: 12.5px; margin: 8px 2px 0; }
  .row { display: flex; gap: 10px; align-items: center; }
  .row.wrap { flex-wrap: wrap; }
  .col { display: flex; flex-direction: column; gap: 4px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
  .tabs { display: flex; gap: 4px; margin-bottom: 12px; background: var(--bg); padding: 4px; border-radius: 10px; }
  .tabs button { flex: 1; border: none; background: transparent; padding: 7px 4px; color: var(--muted); }
  .tabs button.on { background: var(--panel2); color: var(--text); }
  .tabs button .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--warn); margin-left: 5px; vertical-align: middle; }
  .drop { border: 1.5px dashed var(--line); border-radius: 10px; padding: 18px; text-align: center; color: var(--muted); cursor: pointer; transition: .15s; }
  .drop:hover, .drop.over { border-color: var(--accent2); color: var(--text); background: #2a231d; }
  .tracks { margin-top: 10px; max-height: 430px; overflow: auto; }
  .trk { display: grid; grid-template-columns: 18px 26px 26px 1fr auto 24px; gap: 6px; align-items: center; padding: 4px 4px; border-radius: 7px; }
  .trk:hover { background: var(--panel2); }
  .trk.dragging { opacity: .4; }
  .trk.over { box-shadow: inset 0 2px 0 var(--accent); }
  .trk .h { cursor: grab; color: var(--muted); text-align: center; user-select: none; }
  .trk .n { color: var(--muted); font-size: 12px; text-align: right; }
  .trk input { border-color: transparent; background: transparent; padding: 4px 6px; }
  .trk input:hover { border-color: var(--line); cursor: text; }
  .trk input:focus { border-color: var(--accent2); background: var(--bg); }
  .tracks.busy { opacity: .5; pointer-events: none; }
  .toast { display: flex; align-items: center; }
  .trk .d { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .plhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 10px 4px 4px; padding-bottom: 4px; border-bottom: 1px solid var(--line); }
  .plhead:first-child { margin-top: 0; }
  .plhead span.rename { cursor: pointer; }
  .plhead span.rename:hover { text-decoration: underline; }
  .intro-frame { aspect-ratio: 16/9; border-radius: 8px; overflow: hidden; display: grid; place-items: center; margin: 10px 0 4px;
    background: repeating-conic-gradient(#3a3a3a 0 25%, #262626 0 50%) 0 0/20px 20px; border: 1px solid var(--line); }
  .intro-frame img { max-width: 100%; max-height: 100%; display: block; }
  .pick { margin-top: 8px; border: 1px solid var(--line); border-radius: 10px; padding: 10px; background: var(--bg); }
  .pick .list { max-height: 260px; overflow: auto; margin: 6px 0; }
  .pick label.song { display: grid; grid-template-columns: 20px 1fr auto; gap: 6px; align-items: center; padding: 3px 2px; color: var(--text); font-size: 13px; cursor: pointer; }
  .pick label.song span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pick label.song small { color: var(--muted); font-variant-numeric: tabular-nums; }
  .plhead span { color: var(--accent2); font-size: 12.5px; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .plhead small { color: var(--muted); font-weight: 400; }
  .icon { border: none; background: transparent; padding: 2px; color: var(--muted); border-radius: 6px; }
  .icon:hover { color: var(--text); background: var(--line); }
  .icon.playing { color: var(--accent); }
  .meter { height: 8px; background: var(--bg); border-radius: 99px; overflow: hidden; margin-top: 6px; }
  .meter > div { height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s; }
  .meter.warn > div { background: var(--warn); }
  .styles { display: grid; grid-template-columns: repeat(auto-fit, minmax(76px, 1fr)); gap: 6px; }
  .style-group { margin: 12px 0 16px; }
  .style-group h5 { margin: 0 0 7px; color: var(--accent2); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
  .style-group .styles { margin: 0; }
  .styles button { padding: 8px 2px 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; }
  .styles button.on { border-color: var(--accent); background: #2f261d; }
  .styles svg { width: 54px; height: 28px; }
  .visual-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(126px, 1fr)); gap: 8px; margin-top: 10px; }
  .visual-item { min-width: 0; padding: 5px; text-align: left; }
  .visual-item.on { border-color: var(--accent); }
  .visual-item img, .visual-item .video-ph { display: block; width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 5px; background: #171717; }
  .visual-item .video-ph { display: grid; place-items: center; font-size: 25px; }
  .visual-item span { display: block; margin-top: 5px; font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sl { display: grid; grid-template-columns: 92px 1fr 46px; gap: 8px; align-items: center; margin: 6px 0; }
  .sl output { color: var(--muted); font-size: 12px; text-align: right; font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--accent2); }
  input[type=color] { width: 44px; height: 30px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); padding: 2px; }
  .switch { display: flex; align-items: center; gap: 8px; cursor: pointer; color: var(--text); font-size: 14px; }
  .switch input { width: 34px; height: 18px; appearance: none; background: var(--line); border-radius: 99px; position: relative; cursor: pointer; transition: .15s; margin: 0; }
  .switch input::after { content: ""; position: absolute; width: 14px; height: 14px; border-radius: 50%; background: #fff; top: 2px; left: 2px; transition: .15s; }
  .switch input:checked { background: var(--accent2); }
  .switch input:checked::after { left: 18px; }
  .section { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 12px; }
  .section:first-child { border-top: none; padding-top: 0; margin-top: 0; }
  .section h4 { margin: 0 0 8px; font-size: 13.5px; }
  .sub { padding-left: 4px; display: grid; gap: 8px; margin-top: 8px; }
  .render { margin-top: 14px; }
  .render .btns { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .progress { margin-top: 12px; }
  .progress .bar { height: 10px; background: var(--bg); border-radius: 99px; overflow: hidden; }
  .progress .bar > div { height: 100%; background: linear-gradient(90deg, var(--accent2), var(--accent)); width: 0; transition: width .5s; }
  .progress .bar.indet > div { width: 30% !important; animation: indet 1.4s infinite ease-in-out; }
  @keyframes indet { 0% { margin-left: -30%; } 100% { margin-left: 100%; } }
  .progress .info { display: flex; justify-content: space-between; color: var(--muted); font-size: 12.5px; margin-top: 6px; }
  details.log summary { cursor: pointer; color: var(--muted); font-size: 12.5px; margin-top: 8px; }
  details.log pre { background: var(--bg); border-radius: 8px; padding: 10px; max-height: 220px; overflow: auto; font-size: 12px; white-space: pre-wrap; margin: 6px 0 0; }
  .result { margin-top: 14px; }
  .result video { width: 100%; border-radius: 10px; background: #000; }
  .copyrow { display: flex; justify-content: space-between; align-items: center; margin: 10px 0 4px; }
  .err { color: var(--err); white-space: pre-wrap; font-size: 13px; }
  .okc { color: var(--ok); }
  .modal { position: fixed; inset: 0; background: #0009; display: grid; place-items: center; z-index: 20; }
  .modal .card { width: min(460px, 92vw); display: grid; gap: 12px; max-height: 92vh; overflow: auto; }
  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--panel2); border: 1px solid var(--line); padding: 9px 16px; border-radius: 10px; z-index: 30; }
  .toast.e { border-color: var(--err); color: var(--err); }
  .muted { color: var(--muted); }
  .hidden { display: none !important; }
  .chsec { border-top: 1px solid var(--line); padding: 10px 8px 12px; max-height: 40vh; overflow: auto; }
  .chhead { display: flex; justify-content: space-between; align-items: center; padding: 0 6px 6px; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .6px; }
  .citem { display: flex; justify-content: space-between; align-items: center; padding: 6px 8px; border-radius: 8px; cursor: pointer; }
  .citem:hover { background: var(--panel2); }
  .citem .m { color: var(--muted); font-size: 12px; }
  .pfilter { padding: 0 14px 8px; }
  .qsec { border-top: 1px solid var(--line); padding: 10px 14px; font-size: 12.5px; max-height: 32vh; overflow: auto; }
  .qsec .qh { display: flex; justify-content: space-between; align-items: center; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; font-size: 12px; margin-bottom: 6px; }
  .qitem { display: grid; grid-template-columns: 1fr auto; gap: 4px; align-items: center; padding: 4px 0; }
  .qitem .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
  .qitem .m { color: var(--muted); font-size: 11.5px; }
  .qbar { height: 4px; background: var(--bg); border-radius: 9px; overflow: hidden; grid-column: 1 / -1; }
  .qbar > div { height: 100%; background: var(--accent); }
  .fontrow { display: grid; grid-template-columns: 1fr 64px 40px; gap: 6px; align-items: center; background: var(--bg); padding: 6px; border-radius: 8px; }
  .fontrow select { padding: 5px 8px; }
  .fontrow input[type=number] { padding: 5px 6px; }
  .fontrow input[type=color] { width: 40px; height: 30px; }
  .pub h3 { margin: 0 0 10px; font-size: 15px; }
  .pub .grid { display: grid; gap: 10px; }
  .pub .thumb { display: grid; grid-template-columns: 200px 1fr; gap: 12px; align-items: center; }
  .pub .thumb img { width: 200px; aspect-ratio: 16/9; object-fit: cover; border-radius: 8px; background: var(--bg); border: 1px solid var(--line); }
  .pub .thumb .ph { width: 200px; aspect-ratio: 16/9; border-radius: 8px; border: 1.5px dashed var(--line); display: grid; place-items: center; color: var(--muted); font-size: 12px; text-align: center; cursor: pointer; }
  .pub .ytch { display: flex; align-items: center; gap: 8px; }
  .pub .ytch img { width: 26px; height: 26px; border-radius: 50%; }
  .pub ol { margin: 6px 0 10px; padding-left: 20px; color: var(--muted); font-size: 13px; line-height: 1.6; }
  .pub ol b { color: var(--text); }
  .pub a { color: var(--accent); }
  @media (max-width: 1100px) { .body { grid-template-columns: 1fr; } }
  /* The settings panel scrolls on its own, so the preview stays in view while adjusting. */
  @media (min-width: 1101px) {
    .body > .card { position: sticky; top: 106px; max-height: calc(100vh - 124px); overflow: auto; padding-top: 0; }
    .body > .card > .tabs { position: sticky; top: 0; z-index: 3; margin: 0 -14px 12px; padding: 14px 18px 4px; border-radius: 0; background: var(--panel); }
    .body > .card > .tabs::after { content: ""; position: absolute; left: 18px; right: 18px; top: 14px; bottom: 0; background: var(--bg); border-radius: 10px; z-index: -1; }
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">Music <span>Studio</span></div>
    <button class="primary new" id="btnNew">+ Novo vídeo</button>
    <div class="pfilter"><select id="pFilter"><option value="">Todos os canais</option></select></div>
    <div class="plist" id="plist"></div>
    <div class="qsec hidden" id="qsec"></div>
    <div class="chsec">
      <div class="chhead"><span>Canais</span><button class="small ghost" id="btnRefreshCh" title="Ler novamente a pasta channels">↻</button><button class="small ghost" id="btnNewCh">+ Novo canal</button></div>
      <div id="clist"></div>
    </div>
  </aside>
  <main id="main"><div class="empty"><div><p style="font-size:16px">Crie um vídeo novo ou escolha um projeto ao lado.</p></div></div></main>
</div>

<template id="tplProject">
  <div class="top">
    <div class="col grow"><label>Título do vídeo no YouTube</label><input type="text" id="fTitle" placeholder="Rainy Day Piano 🌧️ Soft Piano Music for…"></div>
    <div class="col" style="width:200px"><label>Canal</label><select id="fChannel"></select></div>
    <div class="saved" id="saved"></div>
  </div>
  <div class="body">
    <div>
      <div class="stage" id="stage">
        <video id="bgVideo" muted loop playsinline class="hidden"></video>
        <img id="bgImage" class="hidden" alt="">
        <div class="nobg" id="noBg">Escolha um fundo na aba <b>&nbsp;Fundo&nbsp;</b> →</div>
        <canvas id="cv" width="1920" height="1080"></canvas>
        <button class="expand" id="stageExpand" title="Expandir a prévia para a tela inteira">⛶ Tela inteira</button>
      </div>
      <p class="hint" id="stageHint">Prévia ao vivo. Toque uma música (▶ na aba Músicas) para ver o visualizer reagir. O vídeo final fica igual.</p>
      <div class="card" style="margin-top:10px"><div class="row"><label style="white-space:nowrap">Linha do tempo</label><input type="range" id="timeline" min="0" max="1" value="0" step="1" style="flex:1"><span id="timelineText" class="muted" style="min-width:65px;text-align:right">0:00</span><button class="small ghost" id="timelineLive">Ao vivo</button></div><div class="row" style="justify-content:space-between"><span class="hint" id="timelineTrack" style="margin:0">Escolha um ponto para ver a faixa e os avisos.</span><label class="switch" style="font-size:12px"><input type="checkbox" id="safeGuides"> Guias 5%</label></div></div>

      <div class="card render">
        <div class="btns">
          <button id="btnPreview">Gerar prévia de 20 s</button>
          <label>a partir de</label><input type="text" id="fPrevStart" value="1:00" style="width:64px">
          <span style="flex:1"></span>
          <button class="primary" id="btnBuild">Gerar vídeo completo</button>
        </div>
        <div class="row" style="margin-top:10px; gap:8px">
          <label>Resolução</label>
          <select data-k="video.resolution" style="width:auto">
            <option value="1080p">1080p (Full HD) — ~3,5 GB por hora de vídeo</option>
            <option value="1440p">1440p (2K) — ~6 GB por hora</option>
            <option value="4k">4K — ~10 GB por hora</option>
          </select>
        </div>
        <label class="switch" style="margin-top:10px"><input type="checkbox" data-k="cleanMetadata"> Gerar MP4 sem metadados de origem e sem capítulos embutidos</label>
        <details style="margin-top:10px"><summary style="cursor:pointer;color:var(--muted)">Comparar dois visuais A/B</summary><p class="hint">Ajuste o visual, guarde A; mude os ajustes e guarde B. Depois gere duas prévias de 20 s sem substituir o vídeo final.</p><div class="row wrap"><button class="small" id="captureA">Guardar A</button><button class="small" id="captureB">Guardar B</button><button class="small primary" id="btnCompare">Gerar comparação</button><span id="compareStatus" class="hint"></span></div></details>
        <div class="row" style="margin-top:8px; justify-content: space-between">
          <span class="hint" id="readyHint" style="margin:0"></span>
          <button class="ghost small" id="btnOverlay" title="Só o visualizer sobre fundo preto, para usar no CapCut (modo de mesclagem Tela)">só visualizer p/ CapCut</button>
        </div>
        <p class="err hidden" id="glyphWarn" style="margin:8px 0 0"></p>
        <div class="progress hidden" id="prog">
          <div class="bar" id="progBar"><div></div></div>
          <div class="info"><span id="progStage"></span><span id="progEta"></span></div>
          <div class="row" style="margin-top:8px; justify-content:flex-end"><button class="small" id="btnCancel">Cancelar</button></div>
        </div>
        <div class="err hidden" id="jobErr"></div>
        <details class="log hidden" id="logBox"><summary>detalhes</summary><pre id="logPre"></pre></details>
        <div class="result" id="result"></div>
      </div>
      <details class="card" id="storageBox" style="margin-top:14px"><summary style="cursor:pointer">Armazenamento e limpeza</summary><div id="storageInfo" class="hint">Clique para calcular o espaço usado.</div><div class="row" style="margin-top:10px"><button class="small ghost" id="btnStorageRefresh">Atualizar</button><button class="small" id="btnStorageClean">Limpar cache, prévias e lixeira</button></div></details>
      <div class="card" id="pubCard" style="margin-top:14px"></div>
    </div>

    <div class="card">
      <div class="tabs" id="tabs">
        <button data-tab="bg">Fundo</button><button data-tab="tracks">Músicas</button><button data-tab="viz">Visualizer</button><button data-tab="text">Textos</button><button data-tab="ov">Lembrete</button><button data-tab="intro">Intro</button>
      </div>

      <div data-pane="bg">
        <div class="drop" id="dropBg">Arraste aqui o vídeo do Google Flow<br><small>(ou clique para escolher — mp4, ou imagem png/jpg)</small></div>
        <input type="file" id="fileBg" accept="video/*,image/*" class="hidden">
        <p class="hint" id="bgName"></p>
        <div class="section"><h4>Biblioteca de visuais</h4>
          <p class="hint">Importe imagens e vídeos uma vez e use-os como fundo em qualquer projeto. Clique em um visual para aplicá-lo a este vídeo.</p>
          <div class="drop" id="dropVisuals" style="margin-top:10px">Arraste seus visuais aqui ou clique para importar<br><small>PNG, JPG, WebP, BMP, MP4, MOV, WebM ou MKV</small></div>
          <input type="file" id="fileVisuals" accept=".png,.jpg,.jpeg,.webp,.bmp,.mp4,.mov,.webm,.mkv,image/*,video/*" multiple class="hidden">
          <div class="visual-grid" id="visualLibrary"></div>
        </div>
        <div class="section">
          <h4>Ajustes do fundo</h4>
          <div class="sl"><label>Escurecer</label><input type="range" min="0" max="0.6" step="0.05" data-k="backgroundDim"><output></output></div>
          <div class="sl"><label>Sombra embaixo</label><input type="range" min="0" max="0.9" step="0.05" data-k="bottomShade.strength"><output></output></div>
          <div class="sl"><label>Altura da sombra</label><input type="range" min="150" max="700" step="10" data-k="bottomShade.height"><output></output></div>
          <p class="hint">A sombra embaixo ajuda o visualizer a aparecer em fundos claros. Tremor e emenda do loop são corrigidos automaticamente.</p>
          <h4 style="margin-top:16px">Transição ao repetir o fundo</h4>

        <input type="file" id="fileOv" accept=".png,.gif,.webp,.jpg,.jpeg" class="hidden">
        <div class="section">
          <label class="switch"><input type="checkbox" data-k="overlay.enabled"> Mostrar no vídeo</label>
          <div class="sub" data-if="overlay.enabled">
            <div class="sl"><label>Tamanho</label><input type="range" min="120" max="1400" step="10" data-k="overlay.width"><output data-unit="px"></output></div>
            <div class="sl"><label>Primeira vez</label><input type="range" min="0" max="900" step="15" data-k="overlay.first"><output data-fmt="time"></output></div>
            <div class="sl"><label>Repete a cada</label><input type="range" min="180" max="3600" step="60" data-k="overlay.every"><output data-fmt="min"></output></div>
            <div class="row"><label style="width:92px">Animação</label><select data-k="overlay.anim" style="flex:1"><option value="fade">Aparecer (fade)</option><option value="slide-left">Deslizar da esquerda</option><option value="slide-right">Deslizar da direita</option><option value="rise">Subir</option><option value="none">Sem animação</option></select><button class="small ghost playAnim" title="ver na prévia">▶ ver</button></div>
            <div class="sl"><label>Fica na tela</label><input type="range" min="3" max="30" step="1" data-k="overlay.duration"><output data-unit="s"></output></div>
            <p class="hint" id="ovSchedule"></p>
          </div>
        </div>
        <p class="hint">Arraste a imagem na prévia para escolher onde ela aparece.</p>
      </div>
    </div>
  </div>
</template>

<script>
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const api = async (url, opts = {}) => {
  const r = await fetch(url, { ...opts, headers: { 'content-type': 'application/json', ...(opts.headers || {}) },
    body: opts.body && typeof opts.body !== 'string' ? JSON.stringify(opts.body) : opts.body });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error === 'rota desconhecida' ? 'O app foi atualizado: feche a janela preta do Music Studio e abra o atalho de novo.' : j.error || `erro ${r.status}`);
  return j;
};
const fmt = (s) => { s = Math.max(0, Math.floor(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0'); };
const gb = (b) => b > 1e9 ? (b / 1e9).toFixed(2) + ' GB' : (b / 1e6).toFixed(0) + ' MB';
const getK = (o, k) => k.split('.').reduce((a, p) => a?.[p], o);
const setK = (o, k, v) => { const ps = k.split('.'); let a = o; ps.slice(0, -1).forEach((p) => (a = a[p] ??= {})); a[ps.at(-1)] = v; };
function toast(msg, err, action) {
  $$('.toast').forEach((x) => x.remove());
  const t = document.createElement('div'); t.className = 'toast' + (err ? ' e' : ''); t.textContent = msg;
  if (action) {
    const b = document.createElement('button'); b.className = 'small'; b.style.marginLeft = '12px'; b.textContent = action.label;
    b.onclick = () => { t.remove(); action.fn(); }; t.append(b);
  }
  document.body.append(t); setTimeout(() => t.remove(), action ? 8000 : err ? 6000 : 2200);
}

const S = { channels: [], unconfiguredChannelFolders: [], invalidChannelFolders: [], projects: [], visuals: [], cur: null, p: null, timeline: null, tab: localStorage.getItem('tab') || 'bg', job: null, lastJobId: null };

// ---------- sidebar ----------
async function refreshState() {
  const st = await api('/api/state');
  Object.assign(S, { channels: st.channels, unconfiguredChannelFolders: st.unconfiguredChannelFolders || [], invalidChannelFolders: st.invalidChannelFolders || [], projects: st.projects });
  renderList();
  if (S.p) {
    const sel = $('#fChannel');
    if (sel) { sel.length = 0; for (const c of S.channels) sel.add(new Option(c.name, c.id)); sel.value = S.p.channel || ''; }
  }
  onJob(st.job, st);
}
function renderList() {
  const el = $('#plist'); el.innerHTML = '';
  const fsel = $('#pFilter'), fv = localStorage.getItem('filter') || '';
  fsel.length = 1; for (const c of S.channels) fsel.add(new Option(c.name, c.id));
  fsel.value = S.channels.some((c) => c.id === fv) ? fv : '';
  fsel.onchange = () => { localStorage.setItem('filter', fsel.value); renderList(); };
  const cl = $('#clist'); cl.innerHTML = '';
  for (const c of S.channels) {
    const d = document.createElement('div'); d.className = 'citem'; d.title = 'editar canal';
    d.innerHTML = '<span></span><span class="m">' + S.projects.filter((p) => p.channel === c.id).length + ' vídeos ⚙</span>';
    d.firstChild.textContent = c.name; d.onclick = () => channelModal(c.id); cl.append(d);
  }
  for (const folder of S.unconfiguredChannelFolders) {
    const d = document.createElement('div'); d.className = 'citem'; d.title = 'Criar channel.json nesta pasta';
    d.innerHTML = '<span></span><span class="m">configurar ⚙</span>';
    d.firstChild.textContent = folder; d.onclick = () => channelModal(null, folder); cl.append(d);
  }
  for (const bad of S.invalidChannelFolders) {
    const d = document.createElement('div'); d.className = 'citem'; d.title = `Erro em channels/${bad.id}/channel.json: ${bad.error}`;
    d.innerHTML = '<span></span><span class="m">JSON inválido ⚠</span>';
    d.firstChild.textContent = bad.id; d.onclick = () => toast(`Corrija channels/${bad.id}/channel.json: ${bad.error}`, true); cl.append(d);
  }
  if (!S.projects.some((p) => !fsel.value || p.channel === fsel.value)) el.innerHTML = '<p class="hint" style="padding:0 10px">Nenhum vídeo neste canal ainda.</p>';
  for (const p of S.projects.filter((p) => !fsel.value || p.channel === fsel.value)) {
    const d = document.createElement('div');
    d.className = 'pitem' + (p.name === S.cur ? ' sel' : '');
    const ch = S.channels.find((c) => c.id === p.channel)?.name || p.channel || '';
    d.innerHTML = `<div class="t"></div><div class="m"></div>`;
    $('.t', d).textContent = p.title;
    $('.m', d).textContent = `${ch} · ${p.tracks} músicas`;
    if (p.importing) $('.m', d).insertAdjacentHTML('beforeend', '<span class="badge" style="background:#1e3549;color:#9cc8f0">importando</span>');
    if (p.done) $('.m', d).insertAdjacentHTML('beforeend', `<span class="badge" style="${p.renderStatus === 'fresh' ? '' : 'background:#49351e;color:var(--warn)'}">${p.renderStatus === 'fresh' ? 'pronto' : p.renderStatus === 'stale' ? 'desatualizado' : 'não verificado'}</span>`);
    d.onclick = () => openProject(p.name);
    el.append(d);
  }
}

$('#btnNew').onclick = () => {
  const m = document.createElement('div'); m.className = 'modal';
  m.innerHTML = `<div class="card"><h3 style="margin:0">Novo vídeo</h3>
    <div class="col"><label>Título do vídeo</label><input type="text" id="nTitle" placeholder="Ex.: Autumn Café Bossa Nova ☕"></div>
    <div class="col"><label>Canal</label><select id="nChannel"></select></div>
    <p class="hint" style="margin:0">O visual (visualizer, textos, descrição) vem do padrão do canal — dá para ajustar depois.</p>
    <div class="row" style="justify-content:flex-end"><button class="ghost" id="nCancel">Cancelar</button><button class="primary" id="nOk">Criar</button></div></div>`;
  document.body.append(m);
  const sel = $('#nChannel', m);
  for (const c of S.channels) sel.add(new Option(c.name, c.id));
  sel.add(new Option('+ criar canal novo…', '__new'));
  const last = localStorage.getItem('filter') || S.p?.channel || S.projects[0]?.channel; if (last) sel.value = last;
  sel.onchange = async () => { if (sel.value !== '__new') return; const id = await channelModal(null);
    if (id) { sel.add(new Option(S.channels.find((c) => c.id === id).name, id), sel.length - 1); sel.value = id; } else sel.value = S.channels[0]?.id || ''; };
  $('#nTitle', m).focus();
  $('#nCancel', m).onclick = () => m.remove();
  const ok = async () => {
    try {
      const { name } = await api('/api/projects', { method: 'POST', body: { title: $('#nTitle', m).value, channel: sel.value } });
      m.remove(); S.tab = 'bg'; await refreshState(); openProject(name);
    } catch (e) { toast(e.message, true); }
  };
  $('#nOk', m).onclick = ok;
  $('#nTitle', m).onkeydown = (e) => e.key === 'Enter' && ok();
};

// ---------- channels ----------
$('#btnNewCh').onclick = () => channelModal(null);
$('#btnRefreshCh').onclick = () => refreshState().then(() => toast('Pastas de canais atualizadas ✓')).catch((e) => toast(e.message, true));
function channelModal(id, folder = null) {
  return new Promise(async (resolve) => {
    const ch = id ? await api('/api/channels/' + encodeURIComponent(id)) : null;
    const m = document.createElement('div'); m.className = 'modal';
    m.innerHTML = `<div class="card" style="width:min(560px,94vw)"><h3 style="margin:0">${id ? 'Editar canal' : folder ? 'Configurar pasta de canal' : 'Novo canal'}</h3>
      ${folder ? '<p class="hint" id="cFolderHint" style="margin:0"></p>' : ''}
      <div class="col"><label>Nome do canal</label><input type="text" id="cName" placeholder="Ex.: Lo-fi Night Drive"></div>
      ${id ? '' : '<div class="col"><label>Começar com o visual de</label><select id="cFrom"></select><span class="hint" style="margin:2px 0 0">Copia visualizer, fontes e posição dos textos. Dá para mudar tudo depois, pelo vídeo.</span></div>'}
      <div class="col"><label>Marca na tela (canto do vídeo)</label><input type="text" id="cMark" placeholder="vazio = sem marca"></div>
      <div class="col"><label>Modelo da descrição do YouTube</label><textarea id="cDesc" rows="7"></textarea>
        <span class="hint" style="margin:2px 0 0"><b>{title}</b> vira o título do vídeo e <b>{tracklist}</b> a lista de músicas com os tempos (vira capítulos).</span></div>
      <div class="col"><label>Tags (separadas por vírgula)</label><textarea id="cTags" rows="2" style="min-height:50px"></textarea></div>
      <div class="row" style="justify-content:flex-end"><button class="ghost" id="cCancel">Cancelar</button><button class="primary" id="cOk">${id ? 'Salvar' : 'Criar canal'}</button></div></div>`;
    document.body.append(m);
    if (folder) $('#cFolderHint', m).textContent = `A configuração será salva em channels/${folder}/channel.json. Os outros arquivos da pasta serão preservados.`;
    if (!id) {
      $('#cFrom', m).add(new Option('Padrão básico', ''));
      for (const c of S.channels) $('#cFrom', m).add(new Option(c.name, c.id));
      if (S.channels.length) $('#cFrom', m).value = S.channels[0].id;
    }
    $('#cName', m).value = ch?.name || folder || '';
    $('#cMark', m).value = ch?.watermark || folder || '';
    $('#cDesc', m).value = ch?.description.template || '{title}\n\n🎵 Tracklist\n{tracklist}';
    $('#cTags', m).value = (ch?.description.tags || []).join(', ');
    if (!id) $('#cName', m).oninput = () => ($('#cMark', m).value = $('#cName', m).value);
    $('#cName', m).focus();
    const close = (v) => { m.remove(); resolve(v); };
    $('#cCancel', m).onclick = () => close(null);
    $('#cOk', m).onclick = async () => {
      try {
        const name = $('#cName', m).value;
        const cid = id || (await api('/api/channels', { method: 'POST', body: { name, from: $('#cFrom', m).value, folder } })).id;
        await api('/api/channels/' + encodeURIComponent(cid), { method: 'PUT', body: { name, watermark: $('#cMark', m).value,
          description: { template: $('#cDesc', m).value, tags: $('#cTags', m).value.split(',').map((t) => t.trim()).filter(Boolean) } } });
        await refreshState();
        if (S.cur && S.p?.channel === cid) openProject(S.cur);
        toast(id ? 'Canal salvo ✓' : 'Canal criado ✓');
        close(cid);
      } catch (e) { toast(e.message, true); }
    };
  });
}

// ---------- project ----------
async function openProject(name) {
  stopAudio();
  projectOpenedAt = introStart = performance.now();
  S.timeline = null;
  S.cur = name; localStorage.setItem('cur', name); renderList();
  [S.p] = await Promise.all([api('/api/projects/' + encodeURIComponent(name)), getFonts()]);
  const main = $('#main'); main.innerHTML = ''; main.append($('#tplProject').content.cloneNode(true));
  bindProject(); renderProject(); renderSystemFontChoices(); loadFonts(); loadVisuals().catch((e) => toast(e.message, true));
  showResult();
}

async function getFonts(refresh) {
  if (!S.fonts || refresh) S.fonts = (await api('/api/fonts' + (refresh ? '?refresh' : ''))).fonts;
  return S.fonts;
}
// Font / size / color controls for one text block; sub-blocks (subtitle, label) show what they inherit.
function buildFontRows() {
  for (const row of $$('.fontrow')) {
    const k = row.dataset.font;
    row.innerHTML = `<select data-k="${k}.font" title="fonte"></select><input type="number" min="${row.dataset.min}" max="${row.dataset.max}" data-k="${k}.size" title="tamanho"><input type="color" data-k="${k}.color" title="cor">`;
    fillFontSelect($('select', row));
  }
}
function fillFontSelect(sel) {
  const cur = sel.value; sel.innerHTML = '';
  let group = null;
  for (const f of S.fonts || []) {
    const g = f.source === 'adicionada' ? 'Fontes adicionadas' : 'Fontes do Windows';
    if (!group || group.label !== g) { group = document.createElement('optgroup'); group.label = g; sel.append(group); }
    group.append(new Option(f.name, f.file));
  }
  if (cur) setFontValue(sel, cur);
}
function setFontValue(sel, file) {
  if (!file) return;
  const opt = [...sel.options].find((o) => o.value.toLowerCase() === file.replaceAll('\\', '/').toLowerCase());
  if (opt) sel.value = opt.value;
  else { const o = new Option(file.split(/[\\/]/).pop(), file); sel.prepend(o); sel.value = file; }
}
function renderSystemFontChoices() {
  const sel = $('#systemFontSelect'); if (!sel) return;
  const query = $('#systemFontSearch').value.trim().toLocaleLowerCase();
  const current = sel.value;
  const matches = (S.fonts || []).filter((f) => f.name.toLocaleLowerCase().includes(query));
  sel.replaceChildren();
  for (const f of matches) sel.add(new Option(`${f.name} · ${f.source === 'adicionada' ? 'importada' : 'Windows'}`, f.file));
  if (matches.some((f) => f.file === current)) sel.value = current;
  $('#systemFontCount').textContent = `(${matches.length} de ${(S.fonts || []).length})`;
  previewSystemFont();
}
async function previewSystemFont() {
  const file = $('#systemFontSelect')?.value; if (!file) return;
  try { const fam = await ensureFont(file); if ($('#systemFontSelect')?.value === file) $('#systemFontPreview').style.fontFamily = `"${fam}", sans-serif`; }
  catch { $('#systemFontPreview').style.fontFamily = 'sans-serif'; }
}

function bindProject() {
  buildFontRows();
  $('#stageExpand').onclick = () => document.fullscreenElement ? document.exitFullscreen() : $('#stage').requestFullscreen();
  $('#btnVizFill').onclick = () => {
    const v = S.p.settings.visualizer;
    if (RADIAL_STYLES.includes(v.preset)) { v.radius = 240; v.ringGap = 10; v.height = 290; v.center = { x: .5, y: .5 }; }
    else { v.width = 1920; v.height = 1080; v.bottom = 0; }
    syncControls(); save();
  };
  const sel = $('#fChannel');
  for (const c of S.channels) sel.add(new Option(c.name, c.id));
  $('#fTitle').oninput = () => { S.p.title = $('#fTitle').value; save(); checkGlyphs(); };
  sel.onchange = async () => {
    const to = S.channels.find((c) => c.id === sel.value)?.name;
    if (!confirm(`Mover este vídeo para o canal "${to}"?

O visual, as fontes e o lembrete passam a ser os desse canal.`)) { sel.value = S.p.channel; return; }
    await flush(); S.p = await api('/api/projects/' + S.cur, { method: 'PUT', body: { channel: sel.value } }); renderProject(); loadFonts(); loadPresets(); refreshState(); };
  $$('#tabs button').forEach((b) => (b.onclick = () => { S.tab = b.dataset.tab; localStorage.setItem('tab', S.tab); showTab(); }));

  // generic bound controls
  for (const el of $$('[data-k]')) {
    const k = el.dataset.k;
    const ev = ['range', 'text', 'color', 'number'].includes(el.type) ? 'input' : 'change';
    el.addEventListener(ev, () => {
      let v = el.type === 'checkbox' ? el.checked : el.type === 'range' || el.type === 'number' ? Number(el.value) : el.value;
      if (el.type === 'number' && !(v > 0)) return;
      setK(S.p.settings, k, v);
      if (k.endsWith('.font')) loadFonts();
      if (k === 'audio.crossfade') {
        S.p.audio.crossfade = v;
        S.p.total = Math.max(0, S.p.tracks.reduce((sum, track) => sum + track.duration, 0) - Math.max(0, S.p.tracks.length - 1) * v);
        S.p.totalText = fmt(S.p.total);
        $('#timeline').max = Math.max(1, Math.floor(S.p.total || 1));
        renderTracks();
      }
      if (k.startsWith('audio.ambience.')) syncAmbiencePlayer();
      if (k.startsWith('text.') && /\.(font|text|enabled|prefix)$/.test(k)) checkGlyphs();
      if (k === 'visualizer.anim') introStart = performance.now();
      if (k === 'backgroundAnim') projectOpenedAt = performance.now();
      if (k.startsWith('intro.')) introFrame();
      syncOutputs(); syncVisibility(); save();
    });
  }
  $('#useColor2').onchange = (e) => {
    S.p.settings.visualizer.color2 = e.target.checked ? ($('#color2').value || '#F0C88A') : null;
    syncVisibility(); save();
  };
  $('#anchorCenter').onchange = (e) => { S.p.settings.visualizer.anchor = e.target.checked ? 'center' : 'bottom'; save(); };

  // background
  const dropBg = $('#dropBg'), fileBg = $('#fileBg');
  dropBg.onclick = () => fileBg.click();
  fileBg.onchange = () => fileBg.files[0] && upload('background', fileBg.files[0]);
  dropZone(dropBg, (files) => files[0] && upload('background', files[0]));
  const dropVisuals = $('#dropVisuals'), fileVisuals = $('#fileVisuals');
  dropVisuals.onclick = () => fileVisuals.click();
  fileVisuals.onchange = () => { importVisuals([...fileVisuals.files]); fileVisuals.value = ''; };
  dropZone(dropVisuals, importVisuals);

  // tracks
  const dropT = $('#dropTracks'), fileT = $('#fileTracks');
  dropT.onclick = () => fileT.click();
  fileT.onchange = () => uploadMany([...fileT.files]);
  dropZone(dropT, uploadMany);
  const ambDrop = $('#dropAmbience'), ambInput = $('#fileAmbience');
  ambDrop.onclick = () => ambInput.click();
  ambInput.onchange = () => { const file = ambInput.files[0]; ambInput.value = ''; if (file) uploadAmbience(file); };
  dropZone(ambDrop, (files) => files[0] && uploadAmbience(files[0]));
  $('#ambRemove').onclick = async () => {
    try { await flush(); stopAudio(); S.p = await api(`/api/projects/${encodeURIComponent(S.cur)}/ambience`, { method: 'DELETE' });
      renderProject(); toast('Som ambiente removido ✓'); }
    catch (e) { toast(e.message, true); }
  };
  $('#player').onended = () => { stopAudio(); renderTracks(); };
  // Step 1: list the songs behind the links; step 2 (pick box): choose songs and the playlist they go into.
  $('#btnFlow').onclick = async () => {
    const url = $('#fFlow').value.trim(); if (!url) return toast('cole o link de uma playlist ou de músicas do Flow', true);
    const b = $('#btnFlow'); b.disabled = true; b.textContent = 'Lendo…';
    try { showPick(url, await api(`/api/projects/${S.cur}/flow/preview`, { method: 'POST', body: { url } })); }
    catch (e) { toast(e.message, true); }
    finally { b.textContent = 'Ver músicas'; b.disabled = importingNow(); }
  };
  $('#flowCancel').onclick = async () => {
    try { applyImport(await api(`/api/projects/${S.cur}/flow/cancel`, { method: 'POST' })); } catch (e) { toast(e.message, true); }
  };

  // Searchable categories; variants remain editable through the controls below.
  $('#styleSearch').oninput = renderStyleChoices;
  renderStyleChoices();
  const centerInput = $('#fileCenterImage');
  $('#btnCenterImage').onclick = () => centerInput.click();
  centerInput.onchange = async () => {
    const file = centerInput.files[0]; centerInput.value = ''; if (!file) return;
    try {
      await flush();
      const r = await fetch(`/api/projects/${S.cur}/center-image?name=${encodeURIComponent(file.name)}`, { method: 'POST', body: file });
      const j = await r.json(); if (!r.ok) throw new Error(j.error);
      S.p = j; renderProject(); toast('Foto central adicionada ✓');
    } catch (e) { toast(e.message, true); }
  };
  $('#btnCenterRemove').onclick = async () => {
    try { await flush(); S.p = await api(`/api/projects/${S.cur}/center-image`, { method: 'DELETE' }); renderProject(); toast('Foto central removida ✓'); }
    catch (e) { toast(e.message, true); }
  };
  $('#centerVisualSelect').onchange = async (e) => {
    if (!e.target.value) return;
    try { await flush(); S.p = await api(`/api/projects/${S.cur}/center-image`, { method: 'POST', body: { name: e.target.value } }); renderProject(); toast('Imagem da biblioteca aplicada no centro ✓'); }
    catch (err) { toast(err.message, true); }
  };
  for (const b of [$('#btnChannelLook'), ...$$('.saveLook')]) b.onclick = async () => {
    try { await flush(); S.p = await api(`/api/projects/${S.cur}/channel-look`, { method: 'POST', body: { settings: S.p.settings } }); toast('Salvo como padrão do canal ✓ — os próximos vídeos já começam assim'); }
    catch (e) { toast(e.message, true); }
  };

  // channel intro (green screen)
  const dropIntro = $('#dropIntro'), fileIntro = $('#fileIntro');
  const sendIntro = async (file) => {
    if (!file) return;
    const label = dropIntro.innerHTML;
    try {
      await flush(); // a pending save must not overwrite the color detected on upload
      dropIntro.textContent = `Enviando ${file.name}…`;
      const r = await fetch(`/api/channels/${encodeURIComponent(S.p.channel)}/intro?name=${encodeURIComponent(file.name)}`, { method: 'POST', body: file });
      const j = await r.json(); if (!r.ok) throw new Error(j.error);
      S.p = await api('/api/projects/' + S.cur); renderProject();
      toast(`Intro salva no canal ✓ — cor do fundo detectada: ${j.color}`);
    } catch (e) { dropIntro.innerHTML = label; toast(e.message, true); }
  };
  dropIntro.onclick = () => fileIntro.click();
  fileIntro.onchange = () => { sendIntro(fileIntro.files[0]); fileIntro.value = ''; };
  dropZone(dropIntro, (files) => sendIntro(files[0]));
  $('#introAt').oninput = () => { syncOutputs(); introFrame(); };
  $('#btnIntroRemove').onclick = async () => {
    if (!confirm('Remover a intro deste canal? Ela sai de todos os vídeos do canal (os vídeos já renderizados não mudam).')) return;
    try { await flush(); await api(`/api/channels/${encodeURIComponent(S.p.channel)}/intro`, { method: 'DELETE' }); S.p = await api('/api/projects/' + S.cur); renderProject(); toast('Intro removida'); }
    catch (e) { toast(e.message, true); }
  };

  // channel reminder image
  const dropOv = $('#dropOv'), fileOv = $('#fileOv');
  const sendOv = async (file) => {
    if (!file) return;
    try {
      const r = await fetch(`/api/channels/${encodeURIComponent(S.p.channel)}/overlay?name=${encodeURIComponent(file.name)}`, { method: 'POST', body: file });
      const j = await r.json(); if (!r.ok) throw new Error(j.error);

  };
  if (p.uploadSession && u?.status !== 'running') {
    $('#pResume').onclick = async () => {
      try { S.p = await api(`/api/projects/${S.cur}/publish`, { method: 'POST', body: { resume: true, confirmWarnings: true } }); renderPublish(); }
      catch (e) { toast(e.message, true); }
    };
    $('#pDiscard').onclick = async () => {
      if (!confirm('Descartar esta sessão? O próximo envio começará do zero.')) return;
      try { S.p = await api(`/api/projects/${S.cur}/publish/discard`, { method: 'POST' }); renderPublish(); }
      catch (e) { toast(e.message, true); }
    };
  }
  if (!p.output.video) return;
  const T = $('#pTitle'), D = $('#pDesc'), G = $('#pTags'), P = $('#pPriv'), W = $('#pWhen');
  T.value = f.title; D.value = f.desc; G.value = f.tags; P.value = f.privacy; W.value = f.when;
  const sync = () => { Object.assign(f, { title: T.value, desc: D.value, tags: G.value, privacy: P.value, when: W.value });
    W.classList.toggle('hidden', P.value !== 'schedule'); $('#tLen').textContent = `(${T.value.length}/100)`; };
  [T, D, G, P, W].forEach((x) => x.addEventListener('input', sync)); sync();
  const sendThumb = async (file) => {
    if (!file) return;
    try { const r = await fetch(`/api/projects/${S.cur}/thumbnail?name=${encodeURIComponent(file.name)}`, { method: 'POST', body: file });
      const j = await r.json(); if (!r.ok) throw new Error(j.error); S.p = j; renderPublish(); toast('Thumbnail salva ✓'); }
    catch (e) { toast(e.message, true); }
  };
  $('#pThumb').onclick = () => $('#pThumbFile').click();
  $('#pThumbFile').onchange = () => sendThumb($('#pThumbFile').files[0]);
  dropZone($('#pThumb'), (files) => sendThumb(files[0]));

  const prog = $('#pubProg'), send = $('#pSend');
  if (u?.status === 'running') {
    send.disabled = true;
    prog.innerHTML = `<div class="progress"><div class="bar"><div style="width:${u.pct.toFixed(1)}%"></div></div>
      <div class="info"><span>${u.stage} — ${u.pct.toFixed(0)}% (${gb(u.sent)} de ${gb(u.size)})</span><button class="small" id="pCancel">Cancelar</button></div></div>`;
    $('#pCancel').onclick = async () => { S.p = await api(`/api/projects/${S.cur}/publish/cancel`, { method: 'POST' }); renderPublish(); };
  } else if (u?.status === 'done') {
    prog.innerHTML = `<p class="okc" style="margin:0">✓ Enviado!${u.warning ? '' : ' Thumbnail aplicada.'}</p>${u.warning ? `<p class="err" style="margin:4px 0 0">Thumbnail: ${esc(u.warning)}</p>` : ''}
      <p class="hint">O YouTube ainda vai processar o vídeo (HD/4K podem levar algum tempo). Se o projeto do Google Cloud ainda não passou na auditoria, o vídeo fica privado.</p>`;
  } else if (u?.status === 'error') prog.innerHTML = `<p class="err">✖ ${esc(u.error)}</p>`;
  else if (u?.status === 'canceled') prog.innerHTML = '<p class="hint">Envio cancelado.</p>';

  send.onclick = async () => {
    sync();
    if (f.privacy === 'schedule' && !f.when) return toast('escolha a data e hora do agendamento', true);
    const when = f.privacy === 'schedule' ? `agendado para ${new Date(f.when).toLocaleString('pt-BR')}` : PRIV[f.privacy].toLowerCase();
    const again = p.youtube ? '\n\nAtenção: este vídeo já foi enviado antes — isso cria um vídeo novo no canal.' : '';
    const nothumb = p.thumbnailUrl ? '' : '\n\nSem thumbnail (o YouTube escolhe um frame).';
    try {
      send.disabled = true; prog.textContent = 'Verificando vídeo, áudio e configurações…';
      const payload = { title: f.title, description: f.desc, tags: f.tags.split(',').map((t) => t.trim()).filter(Boolean),
        privacy: f.privacy === 'schedule' ? 'private' : f.privacy, publishAt: f.privacy === 'schedule' ? new Date(f.when).toISOString() : null };
      const check = await api(`/api/projects/${S.cur}/preflight`, { method: 'POST', body: payload });
      if (!check.ok) { prog.textContent = '✖ ' + check.errors.join(' '); return; }
      const report = `Verificação: ${check.info.resolution || '?'} · ${fmt(check.info.duration || 0)} · vídeo ${check.info.videoCodec || '?'} · áudio ${check.info.audioCodec || '?'}\n` +
        (check.warnings.length ? '\nAtenção:\n' + check.warnings.map((x) => '• ' + x).join('\n') : '\nSem avisos.');
      if (!confirm(`${report}\n\nEnviar "${f.title}" para "${yc.title}" como ${when}?${nothumb}${again}`)) return;
      S.p = await api(`/api/projects/${S.cur}/publish`, { method: 'POST', body: {
        ...payload, confirmWarnings: true } });
      renderPublish();
    } catch (e) { toast(e.message, true); }
    finally { send.disabled = false; if (prog?.textContent?.startsWith('Verificando')) prog.textContent = ''; }
  };
}
const esc = (x) => String(x ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

function showResult(j) {
  const el = $('#result'); if (!el) return; el.innerHTML = '';
  const o = S.p.output;
  const kind = j?.status === 'done' ? j.kind : (o.video ? 'build' : o.preview ? 'preview' : null);
  if (kind === 'preview' && o.preview) {
    el.innerHTML = `<div class="copyrow"><b>Prévia</b><span class="muted">20 s, igual ao vídeo final</span></div><video controls autoplay src="${o.preview.url}?v=${o.preview.mtime}"></video>`;
  }
  if (kind === 'compare' && o.compareA && o.compareB) {
    el.innerHTML = `<div class="copyrow"><b>Comparação A/B</b><span class="muted">mesmo trecho e mesmas músicas</span></div><div class="grid2"><div><b>A</b><video controls src="${o.compareA.url}?v=${o.compareA.mtime}"></video></div><div><b>B</b><video controls src="${o.compareB.url}?v=${o.compareB.mtime}"></video></div></div>`;
  }
  if (kind === 'overlay' && o.overlay) {
    el.innerHTML = `<p class="okc">✓ visualizer_overlay.mp4 pronto (${gb(o.overlay.size)}). No CapCut, coloque acima do vídeo e use a mesclagem <b>Tela</b>.</p>`;
    el.append(openBtn('Abrir pasta'));
  }
  if (kind === 'build' && o.video) {
    const d = parseDesc(S.p.description || '');
    el.innerHTML = `<p class="okc" style="margin:0 0 8px">✓ <b>video.mp4</b> pronto — ${S.p.totalText}, ${gb(o.video.size)}</p>`;
    el.append(openBtn('Abrir pasta do vídeo'));
    if (o.preview) { const b = document.createElement('button'); b.className = 'ghost small'; b.style.marginLeft = '6px'; b.textContent = 'ver última prévia'; b.onclick = () => showResult({ status: 'done', kind: 'preview' }); el.append(b); }
    for (const [label, val, rows] of [['Título', d.title, 2], ['Descrição', d.desc, 9], ['Tags', d.tags, 3]]) {
      if (!val) continue;
      const box = document.createElement('div');
      box.innerHTML = `<div class="copyrow"><b>${label}</b><button class="small">Copiar</button></div><textarea rows="${rows}" readonly></textarea>`;
      $('textarea', box).value = val;
      $('button', box).onclick = () => { navigator.clipboard.writeText(val); toast(`${label} copiado ✓`); };
      el.append(box);
    }
  }
}
function openBtn(label) {
  const b = document.createElement('button'); b.className = 'small'; b.textContent = label;
  b.onclick = () => api(`/api/projects/${S.cur}/open`, { method: 'POST', body: { what: 'output' } });
  return b;
}
function parseDesc(s) {
  const title = s.match(/^TÍTULO: (.*)$/m)?.[1] || '';
  let rest = s.replace(/^TÍTULO: .*\n+/, '');
  const ti = rest.indexOf('\n---\nTAGS: ');
  const tags = ti >= 0 ? rest.slice(ti + 11).trim() : '';
  if (ti >= 0) rest = rest.slice(0, ti);
  return { title, desc: rest.trim(), tags };
}

// ---------- boot ----------
// Tells the app (window mode) that a window is still open, so it doesn't quit.
setInterval(() => fetch('/api/version').catch(() => {}), 60 * 1000);
refreshState().then(() => {
  const last = localStorage.getItem('cur');
  if (last && S.projects.some((p) => p.name === last)) openProject(last);
  else if (S.projects[0]) openProject(S.projects[0].name);
}).catch((e) => toast(e.message, true));
</script>
</body>
